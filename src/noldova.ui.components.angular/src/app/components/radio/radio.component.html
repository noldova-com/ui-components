<label class="nol-radio-label">
  <span class="nol-radio-control">
    <input type="radio" class="nol-radio-box" [attr.name]="name" [value]="value()" [checked]="isChecked()"
      [attr.aria-disabled]="disabled() ? resources.trueValue : null" [attr.tabindex]="tabIndex()"
      (click)="refuse($event)" (change)="pick()" />
    <span class="nol-radio-dot" aria-hidden="true"></span>
  </span>
  <span class="nol-radio-text"><ng-content /></span>
</label>
