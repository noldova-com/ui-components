@if (reference().mark; as mark) {
  <nol-link-reference-image class="nol-link-reference-chip-mark" [image]="mark" />
}
@else if (reference().isMarkPending) {
  <span class="nol-link-reference-chip-slot" aria-hidden="true"></span>
}
<nol-link-reference-image class="nol-link-reference-chip-icon" [image]="reference().icon" />
<span class="nol-link-reference-chip-text">{{ text() }}</span>
