<section class="nol-site-section-block nol-site-shell" [attr.id]="sectionId()" [attr.aria-labelledby]="headingId()">
  <div class="nol-site-section-heading">
    <div class="nol-site-section-titles">
      @if (eyebrow(); as eyebrowText) {
        <p class="nol-site-eyebrow nol-site-section-eyebrow">{{ eyebrowText }}</p>
      }
      <h2 class="nol-site-section-title" [id]="headingId()">{{ title() }}</h2>
    </div>
    @if (copyLines().length > 0) {
      <p class="nol-site-section-copy">
        @for (line of copyLines(); track $index) {
          <span class="nol-site-section-copy-line">{{ line }}</span>
        }
      </p>
    } @else {
      <p class="nol-site-section-copy"><ng-content select="[nolSiteSectionCopy]" /></p>
    }
  </div>
  <ng-content />
  @if (shot(); as picture) {
    <div class="nol-site-section-shot">
      <picture class="nol-site-section-shot-frame nol-site-section-shot-light">
        <img [src]="picture.light" [attr.srcset]="shotResources.formatSources(picture.light, picture.lightLarge, picture)" [attr.sizes]="shotResources.shotSizes"
          [width]="picture.width" [height]="picture.height" [alt]="picture.alt" [style.aspect-ratio]="picture.width + ' / ' + picture.height" loading="lazy" decoding="async" />
      </picture>
      <picture class="nol-site-section-shot-frame nol-site-section-shot-dark">
        <img [src]="picture.dark" [attr.srcset]="shotResources.formatSources(picture.dark, picture.darkLarge, picture)" [attr.sizes]="shotResources.shotSizes"
          [width]="picture.width" [height]="picture.height" [alt]="picture.alt" [style.aspect-ratio]="picture.width + ' / ' + picture.height" loading="lazy" decoding="async" />
      </picture>
    </div>
  }
</section>
