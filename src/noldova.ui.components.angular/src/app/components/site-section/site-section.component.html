<section class="nol-site-section-block nol-site-shell" [attr.id]="sectionId()" [attr.aria-labelledby]="headingId()">
  <div class="nol-site-section-heading">
    <div class="nol-site-section-titles">
      @if (eyebrow(); as eyebrowText) {
        <p class="nol-site-eyebrow nol-site-section-eyebrow">{{ eyebrowText }}</p>
      }
      <h2 class="nol-site-section-title" [id]="headingId()">{{ title() }}</h2>
    </div>
    @if (copyLines().length > 0) {
      <p class="nol-site-section-copy">
        @for (line of copyLines(); track $index) {
          <span class="nol-site-section-copy-line">{{ line }}</span>
        }
      </p>
    } @else {
      <p class="nol-site-section-copy"><ng-content select="[nolSiteSectionCopy]" /></p>
    }
  </div>
  <ng-content />
</section>
