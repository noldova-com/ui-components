<label class="nol-checkbox-label">
  <span class="nol-checkbox-control">
    <input type="checkbox" class="nol-checkbox-box" [checked]="checked()"
      [attr.aria-disabled]="disabled() ? resources.trueValue : null" (click)="refuse($event)" (change)="toggle($event)" />
    <svg class="nol-checkbox-mark" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3 8.5 6 11.5 13 4.5" /></svg>
  </span>
  <span class="nol-checkbox-text"><ng-content /></span>
</label>
