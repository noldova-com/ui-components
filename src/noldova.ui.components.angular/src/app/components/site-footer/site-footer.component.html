<div class="nol-site-footer-inner">
  <div class="nol-site-footer-top">
    <div class="nol-site-footer-brand">
      <nol-site-lockup [wordmark]="wordmark()" [name]="name()" [href]="homeHref()" />
      @if (line(); as lineText) {
        <p class="nol-site-footer-line">{{ lineText }}</p>
      }
    </div>
    @for (group of groups(); track group.title) {
      <nav class="nol-site-footer-group" [attr.aria-label]="group.title">
        <p class="nol-site-footer-title" aria-hidden="true">{{ group.title }}</p>
        <ul class="nol-site-footer-links">
          @for (link of group.links; track link.href) {
            <li><a class="nol-site-footer-link" [href]="link.href" [attr.aria-current]="link.isCurrent ? partResources.currentPage : null">{{ link.label }}</a></li>
          }
        </ul>
      </nav>
    }
  </div>
  <div class="nol-site-footer-bottom">
    <p class="nol-site-footer-notice">{{ notice() }}</p>
    <ng-content />
  </div>
</div>
