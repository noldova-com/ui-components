<nol-gallery-specimen [name]="text.tree" [size]="sizes.Wide" noHover>
  <nol-gallery-cell [caption]="text.defaultState">
    <nol-tree class="nol-gallery-tree" [nodes]="treeNodes()" [movable]="true" [label]="text.treeLabel" [current]="treeCurrent()" (activated)="treeCurrent.set($event.id)" (moved)="moveTreeNode($event)" />
  </nol-gallery-cell>
  <nol-gallery-cell [caption]="text.focus">
    <nol-tree class="nol-gallery-tree" nolGalleryFocus="[role=treeitem]" [nodes]="recentRows" [label]="text.treeLabel" />
  </nol-gallery-cell>
  <nol-gallery-cell long [caption]="text.longCaption">
    <nol-tree class="nol-gallery-tree nol-gallery-narrow" [nodes]="longRows" [label]="text.treeLabel" />
  </nol-gallery-cell>
</nol-gallery-specimen>
