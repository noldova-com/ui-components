<section class="nol-gallery-specimen" [attr.aria-label]="name()">
  <h3 class="nol-gallery-specimen-name">{{ name() }}</h3>
  <div class="nol-gallery-specimen-cells" [attr.data-size]="size()">
    <ng-content select="nol-gallery-cell:not([long])" />
  </div>
  @if (hasLongText()) {
    <div class="nol-gallery-specimen-long">
      <ng-content select="nol-gallery-cell[long]" />
    </div>
  }
  <ng-content />
</section>
