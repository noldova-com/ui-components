<nol-gallery-specimen [name]="text.virtualFeed" [size]="sizes.Wide" noHover>
  <nol-gallery-cell [caption]="text.defaultState">
    <div class="nol-gallery-feed">
      <nol-virtual-list class="nol-gallery-feed-list" [kind]="kinds.Feed" [label]="text.virtualFeedLabel" [source]="messages" [busy]="replies() > 0">
        <ng-template [nolVirtualRow]="messages" let-message let-labelId="labelId">
          <ng-container [ngTemplateOutlet]="row" [ngTemplateOutletContext]="{ $implicit: message, labelId }" />
        </ng-template>
      </nol-virtual-list>
      <button type="button" nol-button [variant]="variants.Secondary" (click)="streamReply()">{{ text.virtualFeedStream }}</button>
    </div>
  </nol-gallery-cell>
  <nol-gallery-cell [caption]="text.virtualFeedSlow">
    <nol-virtual-list class="nol-gallery-feed-list nol-gallery-feed-slow" [kind]="kinds.Feed" [label]="text.virtualFeedLabel" [source]="slowMessages">
      <ng-template [nolVirtualRow]="slowMessages" let-message let-labelId="labelId">
        <ng-container [ngTemplateOutlet]="row" [ngTemplateOutletContext]="{ $implicit: message, labelId }" />
      </ng-template>
    </nol-virtual-list>
  </nol-gallery-cell>
  <nol-gallery-cell [caption]="text.virtualFeedNewest">
    <nol-gallery-newest-feed class="nol-gallery-feed" />
  </nol-gallery-cell>
  <nol-gallery-cell [caption]="text.focus">
    <nol-virtual-list class="nol-gallery-feed-list nol-gallery-feed-short" [nolGalleryFocus]="focusedFeed" [kind]="kinds.Feed" [label]="text.virtualFeedLabel" [source]="shortMessages">
      <ng-template [nolVirtualRow]="shortMessages" let-message let-labelId="labelId">
        <ng-container [ngTemplateOutlet]="row" [ngTemplateOutletContext]="{ $implicit: message, labelId }" />
      </ng-template>
    </nol-virtual-list>
  </nol-gallery-cell>
  <nol-gallery-cell long [caption]="text.longCaption">
    <nol-virtual-list class="nol-gallery-feed-list nol-gallery-feed-short nol-gallery-narrow" [kind]="kinds.Feed" [label]="text.virtualFeedLabel" [source]="longMessages">
      <ng-template [nolVirtualRow]="longMessages" let-message let-labelId="labelId">
        <ng-container [ngTemplateOutlet]="row" [ngTemplateOutletContext]="{ $implicit: message, labelId }" />
      </ng-template>
    </nol-virtual-list>
  </nol-gallery-cell>
  <ng-template #row let-message let-labelId="labelId">
    <nol-message [author]="message.author" [time]="message.time" [blocks]="message.blocks" [status]="message.status" [key]="message.key" [labelId]="labelId" />
  </ng-template>
</nol-gallery-specimen>
