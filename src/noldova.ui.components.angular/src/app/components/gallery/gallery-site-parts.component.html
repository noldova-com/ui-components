<nol-gallery-specimen [name]="text.siteHero" [size]="sizes.Full">
  <nol-gallery-cell [caption]="text.siteProduct">
    <nol-site-hero class="nol-gallery-site" [eyebrow]="text.siteHeroEyebrow" [title]="text.siteHeroTitle" [accent]="text.siteHeroAccent" [closing]="text.siteHeroClosing"
      [actions]="actions" [shot]="shot" titleId="nol-gallery-hero-product">{{ text.siteHeroCopy }}</nol-site-hero>
  </nol-gallery-cell>
  <nol-gallery-cell [caption]="text.sitePhone">
    <div class="nol-gallery-site nol-gallery-site-phone">
      <nol-site-hero [eyebrow]="text.siteHeroEyebrow" [title]="text.siteHeroTitle" [accent]="text.siteHeroAccent" [closing]="text.siteHeroClosing" [actions]="actions" [shot]="shot"
        titleId="nol-gallery-hero-phone">{{ text.siteHeroCopy }}</nol-site-hero>
    </div>
  </nol-gallery-cell>
  <nol-gallery-cell [caption]="text.hover">
    <nol-site-hero class="nol-gallery-site" [nolGalleryHover]="action" [title]="text.siteHeroTitle" [actions]="actions" titleId="nol-gallery-hero-hover">{{ text.siteHeroCopy }}</nol-site-hero>
  </nol-gallery-cell>
  <nol-gallery-cell [caption]="text.focus">
    <nol-site-hero class="nol-gallery-site" [nolGalleryFocus]="action" [title]="text.siteHeroTitle" [actions]="actions" titleId="nol-gallery-hero-focus">{{ text.siteHeroCopy }}</nol-site-hero>
  </nol-gallery-cell>
  <nol-gallery-cell long [caption]="text.longCaption">
    <div class="nol-gallery-site nol-gallery-narrow">
      <nol-site-hero [title]="text.siteHeroLongTitle" [accent]="text.siteHeroAccent" [actions]="actions" titleId="nol-gallery-hero-long">{{ text.siteHeroCopy }}</nol-site-hero>
    </div>
  </nol-gallery-cell>
</nol-gallery-specimen>

<nol-gallery-specimen [name]="text.siteSection" [size]="sizes.Full" noHover noFocus>
  <nol-gallery-cell [caption]="text.siteProduct">
    <nol-site-section class="nol-gallery-site" [eyebrow]="text.siteSectionEyebrow" [title]="text.siteSectionTitle" [copy]="text.siteSectionCopy" headingId="nol-gallery-section-product" />
  </nol-gallery-cell>
  <nol-gallery-cell [caption]="text.sitePhone">
    <div class="nol-gallery-site nol-gallery-site-phone">
      <nol-site-section [eyebrow]="text.siteSectionEyebrow" [title]="text.siteSectionTitle" [copy]="text.siteSectionCopy" headingId="nol-gallery-section-phone" />
    </div>
  </nol-gallery-cell>
  <nol-gallery-cell long [caption]="text.longCaption">
    <div class="nol-gallery-site nol-gallery-narrow">
      <nol-site-section [title]="text.siteSectionLongTitle" [copy]="text.siteSectionCopy" headingId="nol-gallery-section-long" />
    </div>
  </nol-gallery-cell>
</nol-gallery-specimen>

<nol-gallery-specimen [name]="text.siteCards" [size]="sizes.Full" noHover noFocus>
  <nol-gallery-cell [caption]="text.siteProduct">
    <nol-site-section class="nol-gallery-site" [title]="text.siteCards" headingId="nol-gallery-cards-product">
      <nol-site-card-grid>
        @for (card of cards; track card) {
          <nol-site-card [icon]="text.siteCardIcons[card] ?? null" [index]="'0' + (card + 1)" [title]="text.siteCardTitles[card] ?? ''" [text]="text.siteCardTexts[card] ?? null" />
        }
      </nol-site-card-grid>
    </nol-site-section>
  </nol-gallery-cell>
  <nol-gallery-cell [caption]="text.sitePhone">
    <div class="nol-gallery-site nol-gallery-site-phone">
      <nol-site-section [title]="text.siteCards" headingId="nol-gallery-cards-phone">
        <nol-site-card-grid>
          @for (card of cards; track card) {
            <nol-site-card [icon]="text.siteCardIcons[card] ?? null" [index]="'0' + (card + 1)" [title]="text.siteCardTitles[card] ?? ''" [text]="text.siteCardTexts[card] ?? null" />
          }
        </nol-site-card-grid>
      </nol-site-section>
    </div>
  </nol-gallery-cell>
  <nol-gallery-cell long [caption]="text.longCaption">
    <div class="nol-gallery-site nol-gallery-narrow">
      <nol-site-section [title]="text.siteCards" headingId="nol-gallery-cards-long">
        <nol-site-card-grid><nol-site-card icon="forum" index="01" [title]="text.siteCardLongTitle" [text]="text.siteCardTexts[0] ?? null" /></nol-site-card-grid>
      </nol-site-section>
    </div>
  </nol-gallery-cell>
</nol-gallery-specimen>
