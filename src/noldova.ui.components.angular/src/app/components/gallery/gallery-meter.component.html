<nol-gallery-specimen [name]="text.meter" noHover noFocus>
  <nol-gallery-cell [caption]="text.meterEmptyCaption"><nol-meter [label]="text.meterLabel" [value]="0">{{ text.meterEmpty }}</nol-meter></nol-gallery-cell>
  <nol-gallery-cell [caption]="text.meterPartCaption"><nol-meter [label]="text.meterLabel" [value]="0.42">{{ text.meterPart }}</nol-meter></nol-gallery-cell>
  <nol-gallery-cell [caption]="text.meterFullCaption"><nol-meter [label]="text.meterLabel" [value]="1">{{ text.meterFull }}</nol-meter></nol-gallery-cell>
  <nol-gallery-cell [caption]="text.meterWarningCaption"><nol-meter [label]="text.meterLabel" [value]="0.92" [warning]="true">{{ text.meterWarning }}</nol-meter></nol-gallery-cell>
  <nol-gallery-cell long [caption]="text.longCaption"><nol-meter class="nol-gallery-narrow" [label]="text.meterLabel" [value]="0.92" [warning]="true">{{ text.meterLong }}</nol-meter></nol-gallery-cell>
</nol-gallery-specimen>
