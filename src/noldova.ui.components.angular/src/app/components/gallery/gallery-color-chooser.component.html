<nol-gallery-specimen [name]="text.colorChooser" [size]="sizes.Wide" noLongText>
  <nol-gallery-cell [caption]="text.defaultState">
    <nol-color-chooser [label]="text.colorChooserLabel" [allowNone]="true" [(value)]="color" />
  </nol-gallery-cell>
  <nol-gallery-cell [caption]="text.hover">
    <nol-color-chooser [nolGalleryHover]="hoveredSwatch" [label]="text.hover" [value]="text.colorChooserInitial" />
  </nol-gallery-cell>
  <nol-gallery-cell [caption]="text.focus">
    <nol-color-chooser [nolGalleryFocus]="focusedSwatch" [label]="text.focus" [value]="text.colorChooserInitial" />
  </nol-gallery-cell>
  <nol-gallery-cell [caption]="text.disabled">
    <nol-color-chooser [label]="text.disabled" [value]="text.colorChooserInitial" [disabled]="true" />
  </nol-gallery-cell>
  <nol-gallery-cell [caption]="text.colorChooserLowContrastCaption">
    <nol-color-chooser [label]="text.colorChooserLowContrastCaption" [(value)]="lowContrast" />
  </nol-gallery-cell>
  <nol-gallery-cell [caption]="text.colorPicker">
    <nol-color-picker [label]="text.colorPicker" [value]="custom()" (valueChange)="custom.set($event)" />
  </nol-gallery-cell>
</nol-gallery-specimen>
