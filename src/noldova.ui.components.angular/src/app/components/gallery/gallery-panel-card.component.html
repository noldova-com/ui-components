<nol-gallery-specimen [name]="text.panelCard" noHover noFocus>
  <nol-gallery-cell [caption]="text.panelShellCaption"><nol-panel-card class="nol-gallery-card" [surface]="surfaces.Shell">{{ text.panelShell }}</nol-panel-card></nol-gallery-cell>
  <nol-gallery-cell [caption]="text.panelPanelCaption"><nol-panel-card class="nol-gallery-card">{{ text.panelPanel }}</nol-panel-card></nol-gallery-cell>
  <nol-gallery-cell long [caption]="text.longCaption"><nol-panel-card class="nol-gallery-card nol-gallery-narrow">{{ text.panelLong }}</nol-panel-card></nol-gallery-cell>
</nol-gallery-specimen>
