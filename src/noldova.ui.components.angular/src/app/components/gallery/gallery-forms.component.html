<nol-gallery-button />

<nol-gallery-icon-button />

<nol-gallery-split-button />

<nol-gallery-specimen [name]="text.attachmentSurface" noHover noFocus noLongText>
  <nol-gallery-cell [caption]="text.attachmentCaption">
    <span class="nol-gallery-attachment">
      <span class="nol-gallery-attachment-glyph material-symbols-rounded" aria-hidden="true">{{ text.glyphFile }}</span>
      <span>{{ text.attachmentName }}</span>
      <span class="nol-gallery-attachment-size">{{ text.attachmentSize }}</span>
    </span>
  </nol-gallery-cell>
</nol-gallery-specimen>

<nol-gallery-checkbox />

<nol-gallery-switch />

<nol-gallery-radio />

<nol-gallery-choice-row />

<nol-gallery-text-field />

<nol-gallery-select />

<nol-gallery-progress />

<nol-gallery-meter />

<nol-gallery-spinner />

<nol-gallery-chip />

<nol-gallery-choice-pills />

<nol-gallery-configuration-table />
