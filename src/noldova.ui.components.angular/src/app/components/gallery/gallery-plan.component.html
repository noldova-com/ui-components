<nol-gallery-specimen [name]="text.planSection" [size]="sizes.Full" noHover noFocus>
  <nol-gallery-cell [caption]="text.defaultState"><nol-plan [plan]="plans.working" /></nol-gallery-cell>
  <nol-gallery-cell [caption]="text.planTypedCaption"><nol-markdown-view [text]="text.planTyped" /></nol-gallery-cell>
  <nol-gallery-cell [caption]="text.planDoneCaption"><nol-plan [plan]="plans.done" /></nol-gallery-cell>
  <nol-gallery-cell [caption]="text.planNotStartedCaption"><nol-plan [plan]="plans.notStarted" /></nol-gallery-cell>
  <nol-gallery-cell long [caption]="text.longCaption">
    <nol-plan class="nol-gallery-narrow" [plan]="plans.long" />
  </nol-gallery-cell>
</nol-gallery-specimen>
