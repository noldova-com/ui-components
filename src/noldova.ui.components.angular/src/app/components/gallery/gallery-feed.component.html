<nol-gallery-message />

<nol-gallery-specimen [name]="text.referenceChips" [size]="sizes.Wide" noHover>
  <nol-gallery-cell [caption]="text.referenceStates">
    <div class="nol-gallery-message"><nol-message [author]="reviewer" [time]="time" [blocks]="referenced" [references]="references" /></div>
  </nol-gallery-cell>
  <nol-gallery-cell [caption]="text.referenceRuns">
    <div class="nol-gallery-message"><nol-message [author]="reviewer" [time]="time" [blocks]="runs" [references]="references" /></div>
  </nol-gallery-cell>
  <nol-gallery-cell [caption]="text.referenceMoreKinds">
    <div class="nol-gallery-message"><nol-message [author]="reviewer" [time]="time" [blocks]="moreKinds" [references]="references" /></div>
  </nol-gallery-cell>
  <nol-gallery-cell [caption]="text.referenceMarks">
    <div class="nol-gallery-message"><nol-message [author]="reviewer" [time]="time" [blocks]="marked" [references]="references" /></div>
  </nol-gallery-cell>
  <nol-gallery-cell [caption]="text.referenceReadingCaption">
    <div class="nol-gallery-message"><nol-message [author]="reviewer" [time]="time" [blocks]="reading" [references]="references" /></div>
  </nol-gallery-cell>
  <nol-gallery-cell [caption]="text.referencePullCard"><nol-link-reference-card [reference]="pullRequest" [state]="open" /></nol-gallery-cell>
  <nol-gallery-cell [caption]="text.referenceIssueCard"><nol-link-reference-card [reference]="issue" [state]="open" /></nol-gallery-cell>
  <nol-gallery-cell [caption]="text.referenceRunCard"><nol-link-reference-card [reference]="run" [state]="failed" /></nol-gallery-cell>
  <nol-gallery-cell [caption]="text.referenceMergeCard"><nol-link-reference-card [reference]="mergeRequest" [state]="open" /></nol-gallery-cell>
  <nol-gallery-cell [caption]="text.referenceWorkItemCard"><nol-link-reference-card [reference]="workItem" [state]="bug" /></nol-gallery-cell>
  <nol-gallery-cell [caption]="text.referenceCommitCard"><nol-link-reference-card [reference]="commit" [state]="commitState" /></nol-gallery-cell>
  <nol-gallery-cell [caption]="text.focus">
    <a class="nol-markdown-link" nol-link-reference-chip nolGalleryFocus="" [reference]="pullRequest" [href]="pullUrl" (click)="$event.preventDefault()"></a>
  </nol-gallery-cell>
  <nol-gallery-cell long [caption]="text.longCaption">
    <div class="nol-gallery-message nol-gallery-narrow"><nol-message [author]="reviewer" [time]="time" [blocks]="longReference" [references]="references" /></div>
  </nol-gallery-cell>
</nol-gallery-specimen>

<nol-gallery-specimen [name]="text.virtualFeed" [size]="sizes.Wide" noHover>
  <nol-gallery-cell [caption]="text.defaultState">
    <div class="nol-gallery-feed">
      <nol-virtual-list class="nol-gallery-feed-list" [kind]="kinds.Feed" [label]="text.virtualFeedLabel" [source]="messages" [busy]="replies() > 0">
        <ng-template [nolVirtualRow]="messages" let-message let-labelId="labelId">
          <ng-container [ngTemplateOutlet]="row" [ngTemplateOutletContext]="{ $implicit: message, labelId }" />
        </ng-template>
      </nol-virtual-list>
      <button type="button" nol-button [variant]="variants.Secondary" (click)="streamReply()">{{ text.virtualFeedStream }}</button>
    </div>
  </nol-gallery-cell>
  <nol-gallery-cell [caption]="text.virtualFeedSlow">
    <nol-virtual-list class="nol-gallery-feed-list nol-gallery-feed-slow" [kind]="kinds.Feed" [label]="text.virtualFeedLabel" [source]="slowMessages">
      <ng-template [nolVirtualRow]="slowMessages" let-message let-labelId="labelId">
        <ng-container [ngTemplateOutlet]="row" [ngTemplateOutletContext]="{ $implicit: message, labelId }" />
      </ng-template>
    </nol-virtual-list>
  </nol-gallery-cell>
  <nol-gallery-cell [caption]="text.virtualFeedNewest">
    <div class="nol-gallery-feed">
      <nol-virtual-list class="nol-gallery-feed-list nol-gallery-feed-newest" [kind]="kinds.Feed" [latest]="edges.Start" [label]="text.virtualFeedLabel" [source]="newestMessages">
        <ng-template [nolVirtualRow]="newestMessages" let-message let-labelId="labelId">
          <ng-container [ngTemplateOutlet]="row" [ngTemplateOutletContext]="{ $implicit: message, labelId }" />
        </ng-template>
      </nol-virtual-list>
      <button type="button" nol-button [variant]="variants.Secondary" (click)="addNewest()">{{ text.virtualFeedAdd }}</button>
    </div>
  </nol-gallery-cell>
  <nol-gallery-cell [caption]="text.focus">
    <nol-virtual-list class="nol-gallery-feed-list nol-gallery-feed-short" [nolGalleryFocus]="focusedFeed" [kind]="kinds.Feed" [label]="text.virtualFeedLabel" [source]="shortMessages">
      <ng-template [nolVirtualRow]="shortMessages" let-message let-labelId="labelId">
        <ng-container [ngTemplateOutlet]="row" [ngTemplateOutletContext]="{ $implicit: message, labelId }" />
      </ng-template>
    </nol-virtual-list>
  </nol-gallery-cell>
  <nol-gallery-cell long [caption]="text.longCaption">
    <nol-virtual-list class="nol-gallery-feed-list nol-gallery-feed-short nol-gallery-narrow" [kind]="kinds.Feed" [label]="text.virtualFeedLabel" [source]="longMessages">
      <ng-template [nolVirtualRow]="longMessages" let-message let-labelId="labelId">
        <ng-container [ngTemplateOutlet]="row" [ngTemplateOutletContext]="{ $implicit: message, labelId }" />
      </ng-template>
    </nol-virtual-list>
  </nol-gallery-cell>
  <ng-template #row let-message let-labelId="labelId">
    <nol-message [author]="message.author" [time]="message.time" [blocks]="message.blocks" [status]="message.status" [key]="message.key" [labelId]="labelId" />
  </ng-template>
</nol-gallery-specimen>
