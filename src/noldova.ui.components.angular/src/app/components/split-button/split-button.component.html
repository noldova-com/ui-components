<button type="button" nol-icon-button class="nol-split-button-main" [icon]="icon()" [label]="label()" [nolTooltip]="tooltip() ?? label()" [nolTooltipSide]="tooltipSide()"
  [busy]="busy()" [attr.aria-disabled]="disabled() ? resources.trueValue : null" (click)="trigger()"></button>
<button type="button" nol-icon-button class="nol-split-button-arrow" [icon]="partResources.splitButtonGlyph" [label]="menuLabel()" [nolTooltip]="menuLabel()"
  [nolTooltipSide]="tooltipSide()" [nolMenuTriggerFor]="menu()" [nolMenuAlignment]="menuAlignment()"></button>
