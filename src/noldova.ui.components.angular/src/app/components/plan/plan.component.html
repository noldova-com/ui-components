<svg class="nol-plan-defs" aria-hidden="true" focusable="false">
  <mask [attr.id]="checkId"><circle cx="8" cy="8" r="8" fill="white" /><path d="M4.75 8.25 7 10.5 11.25 6" fill="none" stroke="black" stroke-width="1.5" stroke-linecap="round"
    stroke-linejoin="round" /></mask>
</svg>
<ul class="nol-plan-steps" role="list" [attr.aria-label]="label()">
  @for (step of plan().steps; track $index) {
    <li class="nol-plan-step" [class]="partResources.planStepStatusClasses[step.status]" [attr.aria-label]="stepLabel(step)">
      <span class="nol-plan-marker" aria-hidden="true">
        @switch (step.status) {
          @case (statuses.Completed) {
            <svg class="nol-plan-mark" viewBox="0 0 16 16" focusable="false"><circle cx="8" cy="8" r="8" [attr.mask]="checkMask" /></svg>
          }
          @case (statuses.InProgress) {
            <nol-spinner class="nol-plan-spinner" />
          }
          @default {
            <svg class="nol-plan-mark" viewBox="0 0 16 16" focusable="false"><circle cx="8" cy="8" r="7.25" pathLength="16" /></svg>
          }
        }
      </span>
      <span class="nol-plan-text">{{ shown(step) }}</span>
    </li>
  }
</ul>
