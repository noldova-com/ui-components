@if (hasHeader()) {
  <div class="nol-configuration-table-header" [class.nol-configuration-table-header-explained]="isExplanationLeading()">
    @if (heading()) {
      <div class="nol-configuration-table-heading" role="heading" [attr.aria-level]="level()">{{ heading() }}</div>
    } @else if (isExplanationLeading()) {
      <p class="nol-configuration-table-explanation">{{ explanation() }}</p>
    }
    <div class="nol-configuration-table-actions"><ng-content select="[nolConfigurationTableAction]" /></div>
  </div>
}
@if (explanation() && !isExplanationLeading()) {
  <p class="nol-configuration-table-explanation">{{ explanation() }}</p>
}
<div class="nol-configuration-table-body"><ng-content /></div>
