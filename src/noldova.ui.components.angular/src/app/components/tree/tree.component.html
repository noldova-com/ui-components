<cdk-tree class="nol-tree" [dataSource]="data()" [childrenAccessor]="childrenOf" [expansionKey]="keyOf" [trackBy]="trackBy" [attr.aria-label]="label()">
  <cdk-tree-node *cdkTreeNodeDef="let node; level as level" #row="cdkTreeNode" #item nolTreeRow class="nol-tree-row" [class.nol-tree-row-current]="node.id === current()"
    [isExpandable]="node.isBranch" [cdkTreeNodeTypeaheadLabel]="node.label" [attr.aria-selected]="node.id === current()" [attr.aria-keyshortcuts]="movable() ? partResources.treeMoveKeys : null"
    [style.--nol-tree-level]="level" (click)="choose(node)" (activation)="choose(node)" (focus)="take(row)"
    [class.nol-tree-row-dragging]="session.dragging()?.id === node.id" [class.nol-tree-row-drop]="session.drop()?.target.id === node.id && session.drop()?.place === places.Into"
    (pointerdown)="press($event, node, item)" (keydown)="nudge($event, node)">
    @if (hasBranches()) {
      <span class="nol-tree-twistie material-symbols-rounded" [class.nol-tree-twistie-open]="row.isExpanded" aria-hidden="true">{{ node.isBranch ? resources.twistieGlyph : null }}</span>
    }
    @if (node.icon; as icon) {
      <span class="nol-tree-icon material-symbols-rounded" aria-hidden="true">{{ icon }}</span>
    }
    <span class="nol-tree-label">{{ node.label }}</span>
  </cdk-tree-node>
</cdk-tree>
@if (session.line(); as line) {
  <div class="nol-drop-line nol-drop-line-row nol-tree-drop-line" [style.top.px]="line.top" [style.inset-inline-start.px]="line.start" [style.width.px]="line.width"></div>
}
@if (session.ghost(); as ghost) {
  <div class="nol-tree-ghost" aria-hidden="true" [style.left.px]="ghost.isRightToLeft ? null : ghost.x" [style.right.px]="ghost.isRightToLeft ? ghost.x : null" [style.top.px]="ghost.y" [style.max-width.px]="ghost.maxWidth">
    @if (session.dragging()?.icon; as icon) {
      <span class="nol-tree-icon material-symbols-rounded">{{ icon }}</span>
    }
    <span class="nol-tree-label">{{ session.dragging()?.label }}</span>
  </div>
}
