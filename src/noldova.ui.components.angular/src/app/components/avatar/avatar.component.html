@if (shownImage(); as image) {
  <img #picture class="nol-avatar-image" [src]="image" alt="" (error)="fail(picture.getAttribute('src'))">
} @else {
  <span #letters class="nol-avatar-initials">{{ shownInitials() }}</span>
}
