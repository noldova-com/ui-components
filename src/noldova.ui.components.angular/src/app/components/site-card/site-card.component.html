@if (hasHead()) {
  <div class="nol-site-card-head">
    @if (icon(); as glyph) {
      <span class="material-symbols-rounded nol-site-card-icon" aria-hidden="true">{{ glyph }}</span>
    }
    @if (index(); as indexText) {
      <span class="nol-site-card-index">{{ indexText }}</span>
    }
  </div>
}
<h3 class="nol-site-card-title">{{ title() }}</h3>
<p class="nol-site-card-text">@if (text(); as bodyText) {<ng-container>{{ bodyText }}</ng-container>} @else {<ng-content select="[nolSiteCardText]" />}</p>
<ng-content />
