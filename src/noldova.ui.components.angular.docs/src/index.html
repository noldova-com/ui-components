<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Noldova UI Components</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
    <meta name="description" content="The components, tokens, fonts and icons of Noldova's interface kit, with live examples and their API." />
    <script>
      try {
        const mode = localStorage.getItem("nol-docs-theme");
        if (mode === "Light" || mode === "Dark")
          document.documentElement.setAttribute("data-nol-theme-mode", mode);
        if (localStorage.getItem("nol-docs-layout") === "Full")
          document.documentElement.setAttribute("data-nol-docs-layout", "Full");
      }
      catch {
      }
    </script>
  </head>
  <body>
    <nol-docs-root></nol-docs-root>
  </body>
</html>
