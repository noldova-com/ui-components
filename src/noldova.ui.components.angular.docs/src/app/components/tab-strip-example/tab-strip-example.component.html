<div class="nol-docs-tab-strip" role="tablist" aria-label="Open notes" (keydown)="move($event)">
  @for (tab of tabs(); track tab) {
    <nol-tab icon="description" [label]="tab" [selected]="tab === selected()" (activate)="selected.set(tab)" (close)="close(tab)" />
  }
</div>
<p>{{ shown() }}</p>
