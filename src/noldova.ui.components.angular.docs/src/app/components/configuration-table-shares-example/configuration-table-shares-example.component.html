<div class="nol-docs-table-holder">
  <nol-configuration-table label="Shortcuts">
    <table nolConfigurationTable>
      <thead>
        <tr>
          <th scope="col" [nolConfigurationTableShare]="3">Command</th>
          <th scope="col" [nolConfigurationTableShare]="2">Keys</th>
        </tr>
      </thead>
      <tbody>
        @for (shortcut of shortcuts; track shortcut[0]) {
          <tr>
            <td>{{ shortcut[0] }}</td>
            <td>{{ shortcut[1] }}</td>
          </tr>
        }
      </tbody>
    </table>
  </nol-configuration-table>
</div>
