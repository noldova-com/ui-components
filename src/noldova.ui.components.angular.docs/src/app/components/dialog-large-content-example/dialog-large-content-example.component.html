<nol-dialog title="Changes since yesterday" [size]="sizes.Large" (dismissed)="finished.emit()">
  <ul class="nol-docs-dialog-changes">
    @for (change of changes; track change) {
      <li>{{ change }}</li>
    }
  </ul>
</nol-dialog>
