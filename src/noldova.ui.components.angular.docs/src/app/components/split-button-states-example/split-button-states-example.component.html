<ul>
  <li><nol-split-button icon="play_arrow" label="Run" menuLabel="Run options" [menu]="options" [disabled]="true" /><span>Unavailable</span></li>
  <li><nol-split-button icon="play_arrow" label="Run" menuLabel="Run options" [menu]="options" [busy]="true" /><span>Busy</span></li>
</ul>
<ng-template #options>
  <nol-menu aria-label="Run options">
    <button type="button" nol-menu-item label="Run with arguments"></button>
    <button type="button" nol-menu-item label="Run and watch"></button>
  </nol-menu>
</ng-template>
