<nol-dialog title="Delete the note?" (dismissed)="answered.emit(false)">
  <p class="nol-docs-dialog-text" nolDialogDescription>The note and its history go for good.</p>
  <button type="button" nol-button nolDialogAction class="nol-docs-dialog-cancel" [variant]="variants.Secondary" (click)="answered.emit(false)">Cancel</button>
  <button type="button" nol-button nolDialogAction [danger]="true" (click)="answered.emit(true)">Delete</button>
</nol-dialog>
