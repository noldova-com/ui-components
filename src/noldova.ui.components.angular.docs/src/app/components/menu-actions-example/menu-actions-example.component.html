<button type="button" nol-button [variant]="variants.Secondary" [nolMenuTriggerFor]="actions">Note actions</button>
<span>Chosen: {{ chosen() }}</span>
<ng-template #actions>
  <nol-menu aria-label="Note actions">
    <button type="button" nol-menu-item label="Rename" icon="edit" shortcut="F2" (triggered)="chosen.set('Rename')"></button>
    <button type="button" nol-menu-item label="Duplicate" icon="content_copy" (triggered)="chosen.set('Duplicate')"></button>
    <nol-menu-separator />
    <button type="button" nol-menu-item label="Delete" icon="delete" [danger]="true" (triggered)="chosen.set('Delete')"></button>
  </nol-menu>
</ng-template>
