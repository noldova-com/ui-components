<div class="nol-docs-sash-layout">
  <div class="nol-docs-sash-pane" [style.width.px]="width()">Outline</div>
  <nol-sash label="Resize the outline" [orientation]="orientations.Vertical" [value]="width()" [minimum]="minimum" [maximum]="maximum" (resize)="resize($event)" />
  <div class="nol-docs-sash-pane nol-docs-sash-main">Note</div>
</div>
<p>Outline: {{ width() }} px</p>
