<section class="nol-docs-example" [attr.aria-label]="example().title">
  <h3 class="nol-docs-example-title">{{ example().title }}</h3>
  <div class="nol-docs-example-preview">
    <ng-container *ngComponentOutlet="example().component" />
  </div>
  @for (file of example().files; track file.name) {
    <nol-code-block class="nol-docs-example-code" [code]="file.code" [language]="file.language" />
  }
</section>
