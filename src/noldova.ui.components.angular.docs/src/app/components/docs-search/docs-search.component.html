<input #searchInput nol-text-field class="nol-docs-search-field" type="search" [attr.aria-label]="resources.searchLabel" [placeholder]="resources.searchLabel" [value]="query()"
  (input)="query.set(field().nativeElement.value)" (keydown.escape)="clear()" />
@if (hasQuery()) {
  <ul class="nol-docs-search-results" [attr.aria-label]="resources.searchResultsLabel">
    @for (page of results(); track page.path) {
      <li><a class="nol-docs-search-result" [routerLink]="page.link" (click)="clear()">{{ page.title }}</a></li>
    } @empty {
      <li class="nol-docs-search-empty">{{ resources.searchEmpty }}</li>
    }
  </ul>
}
