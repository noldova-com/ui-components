  <nol-quick-input label="Add a teammate" icon="search" [items]="items()" [(query)]="query" [isFocusing]="false" [isEmbedded]="true" (chosen)="added.set($event.title)" (dismissed)="query.set('')" />
</div>
<span>Added: {{ added() }}</span>
