<nol-quick-input label="Run a command" emptyText="No command matches." [items]="items()" [(query)]="query" [isFocusing]="false" (chosen)="ran.set($event.title)"
  (dismissed)="query.set('')" />
<span>Ran: {{ ran() }}</span>
