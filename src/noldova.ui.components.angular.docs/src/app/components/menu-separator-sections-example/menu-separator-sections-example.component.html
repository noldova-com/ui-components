<button type="button" nol-icon-button icon="more_vert" label="Tab actions" [nolMenuTriggerFor]="actions"></button>
<span>Chosen: {{ chosen() }}</span>
<ng-template #actions>
  <nol-menu aria-label="Tab actions">
    <button type="button" nol-menu-item label="Close" (triggered)="chosen.set('Close')"></button>
    <button type="button" nol-menu-item label="Close others" (triggered)="chosen.set('Close others')"></button>
    <nol-menu-separator />
    <button type="button" nol-menu-item label="Split right" (triggered)="chosen.set('Split right')"></button>
    <button type="button" nol-menu-item label="Split down" (triggered)="chosen.set('Split down')"></button>
  </nol-menu>
</ng-template>
