name: Docs

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  docs:
    name: Docs
    uses: noldova-com/.github/.github/workflows/docs-image.yml@30b685b9aa02d232a043f7ed5335b6746463e3fa # v2.30.0
    permissions:
      contents: read
      packages: write
    with:
      build: npm ci --no-audit --no-fund && npm run build
      output: _build/docs/browser
      image: ui-components-angular-docs

  latest:
    name: Move the latest label
    needs: docs
    uses: noldova-com/.github/.github/workflows/move-image-label.yml@30b685b9aa02d232a043f7ed5335b6746463e3fa # v2.30.0
    permissions:
      packages: write
    with:
      image: ui-components-angular-docs
      digest: ${{ needs.docs.outputs.digest }}
      label: latest
