name: Build and test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build and test
    uses: noldova-com/.github/.github/workflows/build-and-test.yml@cb9977bb95001c8dc88b3cea5fda8862bb45d057 # v2.41.3
    permissions:
      contents: read
      packages: read
    with:
      targets: linux-x64 linux-arm64 windows-x64 windows-arm64 macos-x64 macos-arm64
      publishes: true
      shards: macos-x64=2 macos-arm64=2
      shard-outputs: _build/angular-coverage
      separate-test: docs
